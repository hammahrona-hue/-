<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>心理学12 · 十站通关 —— 一本小学生也能看懂的行为主义手册</title>
<style>
:root{
  --bg:#f5f5f7; --bg2:#ffffff;
  --ink:#1d1d1f; --ink2:#48484a; --ink3:#86868b;
  --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.14);
  --glass:rgba(255,255,255,.62); --glass2:rgba(255,255,255,.82);
  --hi:rgba(255,255,255,.9);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 12px 32px -12px rgba(0,0,0,.14);
  --blue:#0071e3; --blue-s:rgba(0,113,227,.10);
  --indigo:#5e5ce6; --indigo-s:rgba(94,92,230,.10);
  --teal:#00a8b5; --teal-s:rgba(0,168,181,.10);
  --mint:#1fa971; --mint-s:rgba(31,169,113,.10);
  --orange:#f0730a; --orange-s:rgba(240,115,10,.10);
  --pink:#e0367a; --pink-s:rgba(224,54,122,.10);
  --purple:#a550d8; --purple-s:rgba(165,80,216,.10);
  --yellow:#f5b400; --yellow-s:rgba(245,180,0,.14);
  --red:#e5322d; --red-s:rgba(229,50,45,.10);
  --r:26px; --r2:18px; --r3:12px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000; --bg2:#1c1c1e; --ink:#f5f5f7; --ink2:#d1d1d6; --ink3:#8e8e93;
    --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
    --glass:rgba(28,28,30,.62); --glass2:rgba(44,44,46,.78); --hi:rgba(255,255,255,.08);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px -12px rgba(0,0,0,.6);
    --blue:#2997ff; --indigo:#7d7aff; --teal:#3fd2dc; --mint:#3ad089; --orange:#ff9f0a; --pink:#ff6482; --purple:#c979f0; --yellow:#ffd60a; --red:#ff453a;
    --blue-s:rgba(41,151,255,.16); --indigo-s:rgba(125,122,255,.16); --teal-s:rgba(63,210,220,.14); --mint-s:rgba(58,208,137,.14); --orange-s:rgba(255,159,10,.16); --pink-s:rgba(255,100,130,.16); --purple-s:rgba(201,121,240,.16); --yellow-s:rgba(255,214,10,.16); --red-s:rgba(255,69,58,.16);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.85;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(38% 34% at 12% 14%,rgba(0,113,227,.16),transparent 70%),
    radial-gradient(34% 30% at 88% 10%,rgba(165,80,216,.14),transparent 70%),
    radial-gradient(40% 36% at 78% 86%,rgba(31,169,113,.14),transparent 70%),
    radial-gradient(30% 30% at 20% 90%,rgba(240,115,10,.12),transparent 70%);
  filter:blur(40px)}
a{color:var(--blue);text-decoration:none}
b,strong{font-weight:700}
p{margin:.5em 0}
ul,ol{padding-left:1.35em;margin:.4em 0}
li{margin:.25em 0}
mark{background:var(--yellow-s);color:inherit;border-radius:6px;padding:0 .25em;box-shadow:inset 0 -2px 0 var(--yellow)}
kbd{font:inherit;font-weight:700;color:var(--blue)}
code{font-family:inherit;background:var(--blue-s);border-radius:8px;padding:.05em .45em;font-size:.95em}
.small{font-size:.9em;color:var(--ink3)}
.center{text-align:center}
.hide{display:none!important}

/* ===== 顶栏 ===== */
.topbar{position:sticky;top:0;z-index:50;backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  background:var(--glass);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 20px}
.brand{font-weight:800;font-size:15px;letter-spacing:.01em;white-space:nowrap}
.brand small{color:var(--ink3);font-weight:600;margin-left:8px}
.prog{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--purple));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.prog-txt{font-size:13px;color:var(--ink3);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:999px;padding:10px 18px;color:#fff;background:var(--blue);
  box-shadow:0 6px 18px -6px rgba(0,113,227,.55);transition:transform .15s,box-shadow .15s,filter .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.ghost{background:var(--glass2);color:var(--ink);box-shadow:none;border:1px solid var(--line2)}
.btn.sm{padding:6px 12px;font-size:13px}

/* ===== 布局 ===== */
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;padding:22px 20px 120px}
.side{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow-y:auto;padding:6px 0}
.side h4{margin:8px 10px;font-size:11px;letter-spacing:.14em;color:var(--ink3);font-weight:800}
.side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;color:var(--ink2);font-size:14px;line-height:1.35;transition:background .15s}
.side a:hover{background:var(--glass2)}
.side a.cur{background:var(--glass2);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.side a .n{flex:0 0 26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;background:var(--ink3)}
.side a.ok .n{background:var(--mint)}
.side a.ok .n:after{content:"✓"}
.side a.ok .n span{display:none}
.main{min-width:0}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr;padding:14px 12px 120px;gap:14px}
  .side{position:static;max-height:none;display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .side h4{display:none}
  .side a{white-space:nowrap;background:var(--glass2);border:1px solid var(--line)}
  body{font-size:16.5px}
}

/* ===== 卡片 · Liquid Glass ===== */
.card{position:relative;background:var(--glass);backdrop-filter:saturate(160%) blur(18px);-webkit-backdrop-filter:saturate(160%) blur(18px);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:26px 28px;margin:18px 0;overflow:hidden}
.card:before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,var(--hi),transparent);pointer-events:none}
@media (max-width:600px){.card{padding:20px 18px;border-radius:22px}}

/* 封面 */
.hero{padding:52px 40px 44px;text-align:left;background:linear-gradient(135deg,rgba(255,255,255,.75),rgba(255,255,255,.35));}
@media (prefers-color-scheme: dark){.hero{background:linear-gradient(135deg,rgba(44,44,46,.8),rgba(28,28,30,.5))}}
.hero .eyebrow{font-size:13px;font-weight:800;letter-spacing:.16em;color:var(--blue);text-transform:uppercase}
.hero h1{font-size:clamp(30px,5vw,50px);line-height:1.12;letter-spacing:-.02em;margin:10px 0 12px;font-weight:800}
.hero h1 span{background:linear-gradient(90deg,var(--blue),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-size:19px;color:var(--ink2);max-width:640px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.stat{background:var(--glass2);border:1px solid var(--line);border-radius:16px;padding:10px 16px;font-size:14px;color:var(--ink2)}
.stat b{display:block;font-size:22px;color:var(--ink);letter-spacing:-.01em}

/* 站 */
.station{scroll-margin-top:80px}
.st-head{display:flex;gap:16px;align-items:flex-start;margin:44px 0 6px}
.st-num{flex:0 0 auto;display:inline-grid;place-items:center;width:58px;height:58px;border-radius:20px;color:#fff;font-weight:900;font-size:13px;line-height:1.1;text-align:center;
  background:linear-gradient(145deg,var(--c1,var(--blue)),var(--c2,var(--indigo)));box-shadow:0 10px 26px -10px var(--c1,var(--blue))}
.st-head h2{margin:0;font-size:clamp(24px,3.4vw,34px);letter-spacing:-.02em;line-height:1.2;font-weight:800}
.st-head .st-sub{margin:4px 0 0;color:var(--ink3);font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.04em;padding:3px 10px;border-radius:999px;background:var(--blue-s);color:var(--blue);vertical-align:middle;margin-left:6px}
.tag.hot{background:var(--red-s);color:var(--red)}
.tag.warn{background:var(--orange-s);color:var(--orange)}

/* 区块 */
.blk{border-radius:var(--r2);padding:16px 20px;margin:14px 0;border:1px solid var(--line);position:relative;background:var(--bg2)}
.blk>.lab{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.08em;padding:2px 10px;border-radius:999px;margin:-4px 0 8px -4px}
.story{background:linear-gradient(135deg,var(--indigo-s),var(--purple-s));border-color:transparent}
.story>.lab{background:var(--indigo);color:#fff}
.plain{background:var(--yellow-s);border-color:transparent}
.plain>.lab{background:var(--yellow);color:#3a2a00}
.meta{background:var(--mint-s);border-color:transparent}
.meta>.lab{background:var(--mint);color:#fff}
.term{background:var(--blue-s);border-color:transparent}
.term>.lab{background:var(--blue);color:#fff}
.board{background:var(--bg2);border:1px dashed var(--line2)}
.board>.lab{background:var(--ink);color:var(--bg)}
.board .ppt{font-size:15px;color:var(--ink2);line-height:1.7;margin:0;font-family:inherit;white-space:pre-wrap}
.hook{background:var(--purple-s);border-color:transparent}
.hook>.lab{background:var(--purple);color:#fff}
.trap{background:var(--red-s);border-color:transparent}
.trap>.lab{background:var(--red);color:#fff}
.exam{background:var(--teal-s);border-color:transparent}
.exam>.lab{background:var(--teal);color:#fff}
.teacher{background:var(--orange-s);border-color:transparent}
.teacher>.lab{background:var(--orange);color:#fff}
.review{background:var(--glass2);border:1px solid var(--line2)}
.review>.lab{background:var(--ink3);color:#fff}

.kp{margin:26px 0 8px}
.kp h3{margin:0 0 4px;font-size:21px;letter-spacing:-.01em;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kp h3 .kid{font-size:12px;color:var(--ink3);font-weight:700;background:var(--line);padding:1px 8px;border-radius:99px}
.kp .one{color:var(--ink2);margin:0 0 6px;font-size:16px}

/* 表格 */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:15px;margin:10px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--glass2);font-weight:800;font-size:13.5px;color:var(--ink2)}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:700}
.tbl-wrap{overflow-x:auto}

/* 图 */
figure{margin:14px 0}
figure svg{width:100%;height:auto;display:block;border-radius:var(--r2);background:var(--bg2);border:1px solid var(--line)}
figcaption{font-size:13.5px;color:var(--ink3);margin-top:6px;text-align:center}
svg text{font-family:var(--sans)}

/* 自测题 */
.quiz{background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r2);padding:16px 18px;margin:14px 0}
.quiz .src{font-size:12px;font-weight:800;color:var(--teal);letter-spacing:.06em}
.quiz .q{margin:4px 0 10px;font-weight:600}
.quiz .opts{display:grid;gap:8px}
.quiz .opt{appearance:none;font:inherit;text-align:left;cursor:pointer;border:1px solid var(--line2);background:var(--glass2);color:var(--ink);border-radius:14px;padding:10px 14px;line-height:1.5;transition:all .15s;display:flex;gap:10px}
.quiz .opt:hover{border-color:var(--blue);background:var(--blue-s)}
.quiz .opt i{flex:0 0 24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;font-style:normal;background:var(--line);color:var(--ink2)}
.quiz.done .opt{cursor:default}
.quiz .opt.right{border-color:var(--mint);background:var(--mint-s)}
.quiz .opt.right i{background:var(--mint);color:#fff}
.quiz .opt.wrong{border-color:var(--red);background:var(--red-s)}
.quiz .opt.wrong i{background:var(--red);color:#fff}
.quiz .why{display:none;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--orange-s);border-left:4px solid var(--orange);font-size:15.5px}
.quiz.done .why{display:block;animation:pop .35s ease}
.quiz .why .step{display:block;margin:.2em 0}
.quiz .why .step b{color:var(--orange)}
.quiz .verdict{display:none;font-weight:800;margin-top:10px}
.quiz.done .verdict{display:block}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 自己考自己 */
.rc{border:1px solid var(--line2);border-radius:14px;background:var(--glass2);margin:8px 0;overflow:hidden}
.rc summary{cursor:pointer;list-style:none;padding:11px 14px;font-weight:700;display:flex;gap:10px;align-items:center}
.rc summary::-webkit-details-marker{display:none}
.rc summary:before{content:"？";flex:0 0 24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--indigo);color:#fff;font-size:13px}
.rc[open] summary:before{content:"✓";background:var(--mint)}
.rc .ans{padding:0 14px 12px 48px;color:var(--ink2);font-size:15.5px;animation:pop .3s ease}

/* 完成按钮 */
.done-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 6px}
.done-row .msg{color:var(--mint);font-weight:700;display:none}
.station.ok .done-row .msg{display:inline}
.station.ok .done-row .btn.done{background:var(--mint);box-shadow:none}

/* 小组件 */
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.pill{border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;background:var(--glass2);border:1px solid var(--line2)}
.pill.b{background:var(--blue-s);color:var(--blue);border-color:transparent}
.pill.g{background:var(--mint-s);color:var(--mint);border-color:transparent}
.pill.o{background:var(--orange-s);color:var(--orange);border-color:transparent}
.pill.p{background:var(--purple-s);color:var(--purple);border-color:transparent}
.pill.r{background:var(--red-s);color:var(--red);border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.mini{border-radius:var(--r2);padding:14px 16px;border:1px solid var(--line);background:var(--glass2)}
.mini h4{margin:0 0 4px;font-size:16px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.vs .m{font-weight:900;color:var(--ink3);align-self:center}
@media (max-width:640px){.vs{grid-template-columns:1fr}.vs .m{text-align:center}}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}
.steps li{position:relative;padding-left:40px;margin:8px 0}
.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:2px;width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:800;font-size:13px}
.quote{border-left:4px solid var(--orange);padding:6px 14px;margin:10px 0;color:var(--ink2);background:var(--orange-s);border-radius:0 14px 14px 0;font-size:15.5px}
.quote:before{content:"彤彤老师原话 · ";font-weight:800;color:var(--orange);font-size:12px;letter-spacing:.06em}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:99;transition:all .35s;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.final-score{font-size:42px;font-weight:900;letter-spacing:-.02em;background:linear-gradient(90deg,var(--blue),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
footer{color:var(--ink3);font-size:13px;text-align:center;padding:30px 0 0}
@media print{.topbar,.side,.done-row{display:none}.card{box-shadow:none;backdrop-filter:none;background:#fff}body:before{display:none}}
</style>
</head>
